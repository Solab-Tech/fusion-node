# Dependency upgrades arrive as PRs to read, never as a fresh install on a laptop. Each ecosystem
# waits seven days after a release before proposing it, the same floor pnpm applies
# (pnpm-workspace.yaml): the recent npm worm campaigns were pulled within days.
#
# One PR per ecosystem per week: the actions together, the devDependencies together. A grouped PR
# that fails CI can be split by closing it and letting the next run propose the rest without the
# offender, or by `@dependabot ignore` on the offending package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        patterns: ["*"]
